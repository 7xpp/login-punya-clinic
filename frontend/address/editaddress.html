<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../frontend(css)/style.css">
    <title>Punya Clinic Watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.0/sweetalert2.all.min.js"></script>
    <script type="module" src="../ui(JS)/address/editaddress.js"></script>

    <title>Punya Clinic Watch</title>
</head>
<body style="font-family: 'Prompt', sans-serif;">

    <div class="container mt-5 text-center" style="max-width: 450px;">
        <h1 class="mb-5 fw-bold text-start"><span class="text-gold">แก้ไข</span>ที่อยู่</h1>
        <form id="edit-address-form">
            <div class="text-gray mb-2 text-start">กรอกชื่อ</div>
            <input type="text" class="form-control rounded-pill mb-3" name="name" id="name">
            <div class="text-gray mb-2 text-start">กรอกเบอร์โทร</div>
            <input type="text" class="form-control rounded-pill mb-3" name="tel" id="tel">
            <div class="text-gray mb-2 text-start">กรอกที่อยู่</div>
            <input type="text" class="form-control rounded-pill mb-3" name="address" id="address">
            <div class="text-gray mb-2 text-start">กรอกรายละเอียดที่อยู่</div>
            <input type="text" class="form-control rounded-pill mb-3" name="address_detail" id="address_detail">
            <div class="form-check form-switch d-flex align-items-center gap-2">
                <input class="form-check-input" type="checkbox" role="switch" name="is_default" id="is_default"><label for="is_default">ตั้งเป็นที่อยู่หลัก</label>
            </div>
            <button type="submit" class="btn btn1-custom w-75 mt-5 mb-2">ยืนยัน</button>
        </form>
    </div>

</body>
</html>
